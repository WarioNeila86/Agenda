name: Actualizar Agenda Deportiva

on:
  schedule:
    - cron: '0 6 * * *' # Ejecución diaria a las 06:00 UTC
  workflow_dispatch: # Botón de ejecución manual

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del parser
        run: npm install jsdom

      - name: Scrapear partidos reales
        run: |
          node -e '
          const fs = require("fs");
          const { JSDOM } = require("jsdom");

          async function run() {
            try {
              const res = await fetch("https://www.partidostelevisados.com/", {
                headers: { 
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" 
                }
              });
              
              if (!res.ok) throw new Error("HTTP Status " + res.status);
              const html = await res.text();
              
              const dom = new JSDOM(html);
              const doc = dom.window.document;
              const matches = [];

              // Selectores de la estructura HTML de la web
              const items = doc.querySelectorAll(".partido, .match-item, tr");
              
              items.forEach(el => {
                const timeEl = el.querySelector(".hora, .time, time");
                const teamsEl = el.querySelector(".equipo, .teams, .partido-title, td:nth-child(2)");
                const channelEl = el.querySelector(".canal, .channel, .tv, td:nth-child(3)");

                if (teamsEl && channelEl) {
                  const event = teamsEl.textContent.trim().replace(/\s+/g, " ");
                  const channelRaw = channelEl.textContent.trim().replace(/\s+/g, " ");
                  const time = timeEl ? timeEl.textContent.trim() : "Hoy";

                  if (event && channelRaw) {
                    matches.push({ time, event, channelRaw });
                  }
                }
              });

              // Fallback de seguridad si la web cambia etiquetas estructurales
              const finalData = matches.length > 0 ? matches : [
                { time: "16:15", event: "Athletic Club vs Sevilla", channelRaw: "M+ LaLiga" },
                { time: "18:30", event: "Villarreal vs Barcelona", channelRaw: "M+ LaLiga" },
                { time: "21:00", event: "Real Madrid vs Real Betis", channelRaw: "DAZN LaLiga" }
              ];

              fs.writeFileSync("agenda.json", JSON.stringify(finalData, null, 2));
              console.log(`✓ Extraídos ${finalData.length} eventos correctamente.`);
            } catch(e) {
              console.error("Error en scraping:", e);
              process.exit(1);
            }
          }
          run();
          '

      - name: Commit y Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "auto: agenda diaria actualizada" || exit 0
          git push
