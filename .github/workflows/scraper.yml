name: Actualizar Agenda Deportiva

on:
  schedule:
    - cron: '0 6 * * *' # Todos los días a las 06:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrapear partidos
        run: |
          node -e '
          const fs = require("fs");
          async function run() {
            try {
              // Petición directa desde el servidor de GitHub (sin problemas de CORS)
              const res = await fetch("https://www.partidostelevisados.com/", {
                headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
              });
              const html = await res.text();

              // Aquí parseamos el HTML o generamos la lista
              const matches = [
                { time: "16:15", event: "Partido de Ejemplo 1", channelRaw: "M+ LaLiga" },
                { time: "18:30", event: "Partido de Ejemplo 2", channelRaw: "DAZN LaLiga" }
              ];

              fs.writeFileSync("agenda.json", JSON.stringify(matches, null, 2));
              console.log("Agenda.json generado correctamente");
            } catch(e) {
              console.error("Error al scrapear:", e);
              process.exit(1);
            }
          }
          run();
          '

      - name: Commit y Push del JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "auto: agenda actualizada" || exit 0
          git push
